name: Deploy Frontend to QA

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for QA
      run: npm run build:qa
      
    - name: Deploy to GoDaddy QA
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.GODADDY_FTP_HOST }}
        username: ${{ secrets.GODADDY_FTP_USERNAME }}
        password: ${{ secrets.GODADDY_FTP_PASSWORD }}
        protocol: ftps  # FTP explícito sobre TLS
        port: 21
        local-dir: ./dist/
        server-dir: /public_html/sistema_admin_qa/  # Ruta directa
        dangerous-clean-slate: true
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .htaccess
        
    - name: Deployment Success
      run: |
        echo "🚀 QA deployed successfully!"
        echo "URL: https://muysaludable.com.mx/sistema_admin_qa"